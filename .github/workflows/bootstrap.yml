name: Bootstrap static demo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified static release
        env:
          SOURCE_SHA: 467bd0bae1a49f1f62b544c8f85dc90b4ca89e86
        run: |
          curl --fail --location --retry 3 "https://codeload.github.com/benliew109-max/yunyoudongdong-demo/tar.gz/${SOURCE_SHA}" --output /tmp/yyd-source.tar.gz
          mkdir /tmp/yyd-source
          tar -xzf /tmp/yyd-source.tar.gz --strip-components=1 -C /tmp/yyd-source
          cp -R /tmp/yyd-source/dist/. .
          touch .nojekyll
          printf '%s\n' '# 云游咚咚 Demo' '' 'GitHub Pages 静态发布文件。' '' '访问：https://benliew109-max.github.io/yunyoudongdong-pages/' > README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js app.css design.css screens.json ai-carousel.js destination-sheet.js assets .nojekyll README.md
          git commit -m 'Publish verified static demo assets'
          git push origin main
